name: MAUI Workflow

on:
  push:
    branches:
      - main
      - develop
      - release/**
      - feature/**
      - unitTests
  pull_request:
    branches:
      - main
      - develop
      - release/**
      - feature/**
      - unitTests

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Haal de repository op
        uses: actions/checkout@v4

      - name: Installeer .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Installeer MAUI workloads (inkl. Windows)
        run: |
          dotnet workload install maui
          dotnet workload restore

      - name: Herstel afhankelijkheden (include win-x64 runtime pack)
        run: dotnet restore --runtime win-x64

      - name: Bouw de applicatie
        run: dotnet build --configuration Release --no-restore -r win-x64

      - name: Voer unit tests uit
        run: dotnet test --configuration Release --no-restore --no-build -r win-x64 --verbosity normal